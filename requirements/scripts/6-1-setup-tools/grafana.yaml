ingress:
  enabled: true
  hosts:
  - grafana.cubix.localhost
resources:
  requests:
    cpu: 250m
    memory: 750Mi
persistence:
  enabled: true
admin:
  existingSecret: grafana-admin-login
  userKey: user
  passwordKey: password
sidecar:
  datasources:
    enabled: true
    label: grafana_datasource
    initDatasources: true
    skipReload: true
    watchMethod: LIST
serviceAccount:
  automountServiceAccountToken: true
